[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner-mcp"
version = "0.2.0"
description = "국내 여행 일정을 계획해주는 MCP 서버 (PlayMCP용)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
travel-planner-mcp = "src.travel_planner.server:mcp.run"

[tool.setuptools.packages.find]
where = ["."]
