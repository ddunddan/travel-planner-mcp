# Travel Planner MCP Server - Docker Compose
# 로컬 테스트용

version: '3.8'

services:
  travel-planner-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MCP_TRANSPORT=sse
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

